          type: object
          properties:
            min_length: { type: integer, minimum: 12, maximum: 64 }
        session_policy:
          type: object
          properties:
            idle_minutes: { type: integer, minimum: 5, maximum: 1440 }
            absolute_hours: { type: integer, minimum: 1, maximum: 168 }
            admin_idle_minutes: { type: integer, minimum: 5, maximum: 60 }
            remember_me_days: { type: integer, minimum: 1, maximum: 90 }
        smtp:
          type: object
          properties:
            host: { type: string }
            port: { type: integer, minimum: 1, maximum: 65535 }
            username: { type: [string, 'null'] }
            from_address: { type: string, format: email }
            use_tls: { type: boolean }
            password_set: { type: boolean }

    UpdateRealmSettingsRequest:
      type: object
      properties:
        password_policy:
          type: object
          properties:
