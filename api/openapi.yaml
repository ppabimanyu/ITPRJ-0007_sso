openapi: 3.1.0
info:
  title: SSO Service API
  version: 1.0.0
  description: |
    Kontrak REST untuk sesi/autentikasi, self-service, dan admin console SSO Service.
    Endpoint OIDC (`/realms/{realm}/authorize`, `/token`, `/userinfo`, `/jwks`,
    `/logout`, `/introspect`, `/revoke`, discovery) mengikuti spesifikasi OpenID
    Connect/OAuth2 dan didokumentasikan di `docs/ARCHITECTURE.md`, bukan di sini.

    Semua error non-OIDC memakai `application/problem+json` (RFC 9457) dengan
    field tambahan `code`. Endpoint ber-cookie memakai CSRF double-submit
    (`X-CSRF-Token` harus sama dengan cookie `sso_csrf`). Endpoint pra-sesi
    tetap mewajibkan `X-CSRF-Token` dan validasi Origin/Referer.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: https://sso.example.com
    description: Produksi
  - url: http://localhost:8080
    description: Development
tags:
  - name: Auth
    description: Login, MFA, consent, invite, reset, dan sesi.
  - name: Account
    description: Self-service user.
  - name: Admin Users
    description: Manajemen user dan role assignment.
  - name: Admin Clients
    description: Manajemen client OIDC dan rotasi secret.
  - name: Admin Roles
    description: Daftar dan pembuatan role realm.
  - name: Admin Groups
    description: Daftar dan pembuatan group.
  - name: Admin Sessions
    description: Pemantauan dan pencabutan sesi.
  - name: Admin Audit
    description: Penelusuran audit event.
  - name: Admin Realm
    description: Settings realm (SMTP, password, session).

paths:
  /api/v1/auth/login:
    post:
      operationId: login
      tags: [Auth]
      summary: Login dengan email dan password
      security: []
      parameters:
        - $ref: '#/components/parameters/PreSessionCsrf'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Hasil login; sesi dibuat jika tidak butuh MFA.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '423': { $ref: '#/components/responses/Locked' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        default:
          $ref: '#/components/responses/Internal'

  /api/v1/auth/mfa/verify:
    post:
      operationId: verifyMfa
      tags: [Auth]
      summary: Verifikasi TOTP atau recovery code untuk menyelesaikan login
      security: []
      parameters:
        - $ref: '#/components/parameters/PreSessionCsrf'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaVerifyRequest'
      responses:
        '200':
          description: Sesi dibuat.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaVerifyResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        default:
          $ref: '#/components/responses/Internal'

  /api/v1/auth/mfa/enroll:
    post:
      operationId: enrollMfa
      tags: [Auth]
      summary: Enrollment TOTP paksa untuk admin
      description: |
        `action=start` mengembalikan secret dan otpauth URI.
        `action=confirm` memverifikasi kode, mengaktifkan TOTP, dan mengembalikan
        recovery code satu kali.
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaEnrollRequest'
      responses:
        '200':
          description: Hasil enrollment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaEnrollResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        default:
          $ref: '#/components/responses/Internal'

  /api/v1/auth/consent:
    post:
      operationId: grantConsent
      tags: [Auth]
      summary: Menyetujui scope untuk client third-party
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsentRequest'
      responses:
        '200':
          description: Lanjutkan authorize.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RedirectResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        default:
          $ref: '#/components/responses/Internal'

  /api/v1/auth/logout:
    post:
      operationId: logout
      tags: [Auth]
      summary: Logout sesi saat ini
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        '204': { description: Sesi dicabut. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default:
          $ref: '#/components/responses/Internal'

  /api/v1/auth/forgot-password:
    post:
      operationId: forgotPassword
      tags: [Auth]
      summary: Meminta tautan reset password
      description: Respons selalu sama, terlepas dari apakah email terdaftar.
      security: []
      parameters:
        - $ref: '#/components/parameters/PreSessionCsrf'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '202': { description: Permintaan diterima. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        default:
          $ref: '#/components/responses/Internal'

  /api/v1/auth/reset-password:
    post:
      operationId: resetPassword
      tags: [Auth]
      summary: Menyelesaikan reset password
      security: []
      parameters:
        - $ref: '#/components/parameters/PreSessionCsrf'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '204': { description: Password diubah; semua sesi dicabut. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/RateLimited' }
        default:
          $ref: '#/components/responses/Internal'

  /api/v1/auth/verify-email:
    post:
      operationId: verifyEmail
      tags: [Auth]
      summary: Memverifikasi email
      security: []
      parameters:
        - $ref: '#/components/parameters/PreSessionCsrf'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyEmailRequest'
      responses:
        '204': { description: Email terverifikasi. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/RateLimited' }
        default:
          $ref: '#/components/responses/Internal'

  /api/v1/auth/accept-invite:
    post:
      operationId: acceptInvite
      tags: [Auth]
      summary: Menerima undangan dan menetapkan password
      security: []
      parameters:
        - $ref: '#/components/parameters/PreSessionCsrf'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptInviteRequest'
      responses:
        '204': { description: Password ditetapkan dan email terverifikasi. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/RateLimited' }
        default:
          $ref: '#/components/responses/Internal'

  /api/v1/auth/session:
    get:
      operationId: getSession
      tags: [Auth]
      summary: Melihat sesi saat ini
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Sesi aktif.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionInfo'
        '401': { $ref: '#/components/responses/Unauthorized' }
        default:
          $ref: '#/components/responses/Internal'

  /api/v1/auth/authorize/request:
    get:
      operationId: getAuthorizeRequest
      tags: [Auth]
      summary: Melihat detail auth request untuk halaman login
      security:
        - authRequestCookie: []
      parameters:
        - name: request_id
          in: query
          required: true
          schema:
            type: string
            maxLength: 128
      responses:
        '200':
          description: Detail permintaan authorize.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthRequestInfo'
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        default:
          $ref: '#/components/responses/Internal'

  /api/v1/auth/authorize/complete:
    post:
      operationId: completeAuthorize
      tags: [Auth]
      summary: Menyelesaikan authorize dan mendapatkan redirect URI
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteAuthorizeRequest'
      responses:
        '200':
          description: Redirect ke RP.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RedirectResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        default:
          $ref: '#/components/responses/Internal'

  /api/v1/me:
    get:
      operationId: getMe
      tags: [Account]
      summary: Profil user saat ini
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Profil.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401': { $ref: '#/components/responses/Unauthorized' }
        default:
          $ref: '#/components/responses/Internal'
    patch:
      operationId: updateMe
      tags: [Account]
      summary: Mengubah profil
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileUpdateRequest'
      responses:
        '200':
          description: Profil terbaru.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        default:
          $ref: '#/components/responses/Internal'

  /api/v1/me/password:
    post:
      operationId: changeMyPassword
      tags: [Account]
      summary: Mengubah password
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '204': { description: Password diubah; sesi lain dicabut. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/RateLimited' }
        default:
          $ref: '#/components/responses/Internal'

  /api/v1/me/sessions:
    get:
      operationId: listMySessions
      tags: [Account]
      summary: Daftar sesi aktif milik sendiri
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Daftar sesi.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/MeSession'
        '401': { $ref: '#/components/responses/Unauthorized' }
        default:
          $ref: '#/components/responses/Internal'

  /api/v1/me/sessions/{id}:
    delete:
      operationId: revokeMySession
      tags: [Account]
      summary: Mencabut sesi milik sendiri
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/PathID'
      responses:
        '204': { description: Sesi dicabut. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        default:
          $ref: '#/components/responses/Internal'

  /api/v1/me/mfa/totp:
    post:
      operationId: enrollMyTotp
      tags: [Account]
      summary: Memulai atau mengonfirmasi enrollment TOTP
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaEnrollRequest'
      responses:
        '200':
          description: Hasil enrollment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaEnrollResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        default:
          $ref: '#/components/responses/Internal'
    delete:
      operationId: disableMyTotp
      tags: [Account]
      summary: Menonaktifkan TOTP
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        '204': { description: TOTP dihapus. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        default:
          $ref: '#/components/responses/Internal'

  /api/v1/me/mfa/recovery-codes:
    post:
      operationId: regenerateRecoveryCodes
      tags: [Account]
      summary: Membuat ulang recovery code
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        '200':
          description: Recovery code baru; hanya ditampilkan sekali.
          content:
            application/json:
              schema:
                type: object
                required: [recovery_codes]
                properties:
                  recovery_codes:
                    type: array
                    items: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        default:
          $ref: '#/components/responses/Internal'

  /api/v1/users:
    get:
      operationId: listUsers
      tags: [Admin Users]
      summary: Daftar user
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/After'
        - $ref: '#/components/parameters/Limit'
        - name: q
          in: query
          schema: { type: string }
          description: Cari berdasarkan email atau nama.
        - name: status
          in: query
          schema:
            type: string
            enum: [active, disabled, pending]
      responses:
        '200':
          description: Daftar user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserList'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default:
          $ref: '#/components/responses/Internal'
    post:
      operationId: createUser
      tags: [Admin Users]
      summary: Membuat user dan mengirim undangan
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: User dibuat.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        default:
          $ref: '#/components/responses/Internal'

  /api/v1/users/{id}:
    get:
      operationId: getUser
      tags: [Admin Users]
      summary: Detail user
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/PathID'
      responses:
        '200':
          description: Detail user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default:
          $ref: '#/components/responses/Internal'
    patch:
      operationId: updateUser
      tags: [Admin Users]
      summary: Mengubah user atau menonaktifkannya
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/PathID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: User terbaru.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        default:
          $ref: '#/components/responses/Internal'

  /api/v1/users/{id}/reset-password:
    post:
      operationId: triggerPasswordReset
      tags: [Admin Users]
      summary: Memicu email reset password
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/PathID'
      responses:
        '202': { description: Email reset dijadwalkan. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        default:
          $ref: '#/components/responses/Internal'

  /api/v1/users/{id}/invite:
    post:
      operationId: resendInvite
      tags: [Admin Users]
      summary: Mengirim ulang undangan
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/PathID'
      responses:
        '202': { description: Undangan dijadwalkan. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        default:
          $ref: '#/components/responses/Internal'

  /api/v1/users/{id}/roles:
    post:
      operationId: assignUserRoles
      tags: [Admin Users]
      summary: Mengganti role user
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/PathID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignRolesRequest'
      responses:
        '200':
          description: Role terbaru.
          content:
            application/json:
              schema:
                type: object
                properties:
                  roles:
                    type: array
                    items:
                      $ref: '#/components/schemas/Role'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        default:
          $ref: '#/components/responses/Internal'

  /api/v1/clients:
    get:
      operationId: listClients
      tags: [Admin Clients]
      summary: Daftar client
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/After'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Daftar client.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientList'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default:
          $ref: '#/components/responses/Internal'
    post:
      operationId: createClient
      tags: [Admin Clients]
      summary: Membuat client
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateClientRequest'
      responses:
        '201':
          description: Client dibuat; secret hanya dikembalikan sekali untuk confidential.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientWithSecret'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        default:
          $ref: '#/components/responses/Internal'

  /api/v1/clients/{id}:
    get:
      operationId: getClient
      tags: [Admin Clients]
      summary: Detail client
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/PathID'
      responses:
        '200':
          description: Detail client.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Client'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default:
          $ref: '#/components/responses/Internal'
    patch:
      operationId: updateClient
      tags: [Admin Clients]
      summary: Mengubah client
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/PathID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateClientRequest'
      responses:
        '200':
          description: Client terbaru.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Client'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
