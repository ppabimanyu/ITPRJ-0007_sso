components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-sso_session
      description: Cookie sesi HttpOnly. Di dev namanya `sso_session`.
    authRequestCookie:
      type: apiKey
      in: cookie
      name: __Host-sso_authreq
      description: Cookie pengikat auth request. Di dev namanya `sso_authreq`.
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Harus sama dengan cookie `sso_csrf` dan terikat ke sesi.

  parameters:
    PreSessionCsrf:
      name: X-CSRF-Token
      in: header
      required: true
      schema: { type: string }
      description: CSRF token pra-sesi; juga divalidasi terhadap Origin/Referer.
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        maxLength: 128
      description: Wajib untuk create; replay mengembalikan respons tersimpan.
    PathID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    After:
      name: after
      in: query
      required: false
      schema:
        type: string
      description: Keyset pagination cursor.
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50

  responses:
    BadRequest:
      description: Request tidak valid.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Tidak terautentikasi.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Tidak berwenang.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Tidak ditemukan.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: Konflik state (mis. admin terakhir, MFA sudah aktif).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnprocessableEntity:
      description: Validasi gagal.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Locked:
      description: Akun terkunci sementara.
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    RateLimited:
      description: Terlalu banyak permintaan.
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ServiceUnavailable:
      description: Dependensi tidak tersedia (mis. Redis mati).
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Internal:
      description: Kesalahan server.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code:
          type: string
          examples: [invalid_credentials, account_locked, csrf_invalid, conflict]
        errors:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              message: { type: string }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 1, maxLength: 1024 }
        remember_me: { type: boolean, default: false }
        request_id:
          type: string
          maxLength: 128
          description: Jika login dipicu dari authorize.

    LoginResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [authenticated, mfa_required, mfa_enrollment_required]
        mfa_token:
          type: [string, 'null']
          description: Ada jika status mfa_required.
        session_expires_at:
          type: [string, 'null']
          format: date-time
          description: Ada jika sesi dibuat.
        user:
          oneOf:
            - $ref: '#/components/schemas/User'
            - type: 'null'
        redirect_to:
          type: [string, 'null']
          format: uri
          description: Terisi jika authorize dapat langsung diselesaikan.

    MfaVerifyRequest:
      type: object
      required: [mfa_token]
      properties:
        mfa_token: { type: string }
        code:
          type: string
          description: Kode TOTP 6 digit; salah satu dari code/recovery_code wajib.
        recovery_code:
          type: string
          description: Recovery code; salah satu dari code/recovery_code wajib.

    MfaVerifyResponse:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [authenticated] }
        session_expires_at: { type: string, format: date-time }
        user: { $ref: '#/components/schemas/User' }

    MfaEnrollRequest:
      type: object
      required: [action]
      properties:
        action:
          type: string
          enum: [start, confirm]
        code:
          type: string
          description: Wajib untuk action=confirm.

    MfaEnrollResponse:
      type: object
      required: [action]
      properties:
        action: { type: string, enum: [start, confirm] }
        secret:
          type: [string, 'null']
          description: Hanya pada action=start.
        otpauth_uri:
          type: [string, 'null']
          description: Hanya pada action=start.
        recovery_codes:
          type: [array, 'null']
          items: { type: string }
          description: Hanya pada action=confirm; ditampilkan sekali.

    ConsentRequest:
      type: object
      required: [request_id, scopes]
      properties:
        request_id: { type: string }
        scopes:
          type: array
          items: { type: string }

    CompleteAuthorizeRequest:
      type: object
      required: [request_id]
      properties:
        request_id: { type: string }

    RedirectResponse:
      type: object
      required: [redirect_to]
      properties:
        redirect_to: { type: string, format: uri }

    AuthRequestInfo:
      type: object
      required: [request_id, client_name, scopes]
      properties:
        request_id: { type: string }
        client_id: { type: string }
        client_name: { type: string }
        scopes:
          type: array
          items: { type: string }
        prompt: { type: [string, 'null'] }
        login_required: { type: boolean }
        consent_required: { type: boolean }

    SessionInfo:
      type: object
      required: [user, expires_at, mfa_enrolled]
      properties:
        user: { $ref: '#/components/schemas/User' }
        expires_at: { type: string, format: date-time }
        idle_expires_at: { type: string, format: date-time }
        mfa_enrolled: { type: boolean }
        is_admin: { type: boolean }

    ForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }

    ResetPasswordRequest:
      type: object
      required: [token, new_password]
      properties:
        token: { type: string }
        new_password: { type: string, minLength: 12, maxLength: 256 }

    VerifyEmailRequest:
      type: object
      required: [token]
      properties:
        token: { type: string }

    AcceptInviteRequest:
      type: object
      required: [token, password]
      properties:
        token: { type: string }
        password: { type: string, minLength: 12, maxLength: 256 }

    ChangePasswordRequest:
      type: object
      required: [current_password, new_password]
      properties:
        current_password: { type: string }
        new_password: { type: string, minLength: 12, maxLength: 256 }

    ProfileUpdateRequest:
      type: object
      properties:
        name: { type: string, maxLength: 200 }
        given_name: { type: string, maxLength: 100 }
        family_name: { type: string, maxLength: 100 }
        locale:
          type: string
          enum: [en, id]

    RoleRef:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }

    GroupRef:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }

    User:
      type: object
      required: [id, email, created_at]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        username: { type: [string, 'null'] }
        name: { type: [string, 'null'] }
        given_name: { type: [string, 'null'] }
        family_name: { type: [string, 'null'] }
        locale: { type: [string, 'null'] }
        email_verified_at: { type: [string, 'null'], format: date-time }
        disabled_at: { type: [string, 'null'], format: date-time }
        mfa_enrolled: { type: boolean }
        roles:
          type: array
          items: { $ref: '#/components/schemas/RoleRef' }
        groups:
          type: array
          items: { $ref: '#/components/schemas/GroupRef' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    UserList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/User' }
        next_after:
          type: [string, 'null']

    CreateUserRequest:
      type: object
      required: [email, name]
      properties:
        email: { type: string, format: email }
        name: { type: string, maxLength: 200 }
        username: { type: [string, 'null'] }
        send_invite: { type: boolean, default: true }

    UpdateUserRequest:
      type: object
      properties:
        name: { type: string, maxLength: 200 }
        given_name: { type: string, maxLength: 100 }
        family_name: { type: string, maxLength: 100 }
        locale:
          type: string
          enum: [en, id]
        disabled:
          type: boolean
          description: true mencabut semua sesi dan refresh token.

    AssignRolesRequest:
      type: object
      required: [role_ids]
      properties:
        role_ids:
          type: array
          items: { type: string, format: uuid }

    Client:
      type: object
      required: [id, client_id, name, type, redirect_uris]
      properties:
        id: { type: string, format: uuid }
        client_id: { type: string }
        name: { type: string }
        type: { type: string, enum: [public, confidential] }
        redirect_uris:
          type: array
          items: { type: string, format: uri }
        post_logout_redirect_uris:
          type: array
          items: { type: string, format: uri }
        backchannel_logout_uri:
          type: [string, 'null']
          format: uri
        cors_origins:
          type: array
          items: { type: string, format: uri }
        grant_types:
          type: array
          items:
            type: string
            enum: [authorization_code, refresh_token, client_credentials]
        allowed_scopes:
          type: array
          items: { type: string }
        third_party: { type: boolean }
        access_token_ttl_seconds: { type: [integer, 'null'], minimum: 60, maximum: 3600 }
        id_token_ttl_seconds: { type: [integer, 'null'], minimum: 60, maximum: 3600 }
        disabled: { type: boolean }
        created_at: { type: string, format: date-time }

    ClientWithSecret:
      allOf:
        - $ref: '#/components/schemas/Client'
        - type: object
          properties:
            client_secret:
              type: [string, 'null']
              description: Hanya untuk confidential; ditampilkan sekali.

    ClientList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Client' }
        next_after:
          type: [string, 'null']

    CreateClientRequest:
      type: object
      required: [name, type, redirect_uris]
      properties:
        name: { type: string, maxLength: 200 }
        type: { type: string, enum: [public, confidential] }
        redirect_uris:
          type: array
          minItems: 1
          items: { type: string, format: uri }
        post_logout_redirect_uris:
          type: array
          items: { type: string, format: uri }
        backchannel_logout_uri:
          type: [string, 'null']
          format: uri
        cors_origins:
          type: array
          items: { type: string, format: uri }
        grant_types:
          type: array
          items:
            type: string
            enum: [authorization_code, refresh_token, client_credentials]
        allowed_scopes:
          type: array
          items: { type: string }
        third_party: { type: boolean, default: false }
        access_token_ttl_seconds: { type: [integer, 'null'], minimum: 60, maximum: 3600 }
        id_token_ttl_seconds: { type: [integer, 'null'], minimum: 60, maximum: 3600 }

    UpdateClientRequest:
      type: object
      properties:
        name: { type: string, maxLength: 200 }
        redirect_uris:
          type: array
          items: { type: string, format: uri }
        post_logout_redirect_uris:
          type: array
          items: { type: string, format: uri }
        backchannel_logout_uri:
          type: [string, 'null']
          format: uri
        cors_origins:
          type: array
          items: { type: string, format: uri }
        grant_types:
          type: array
          items:
            type: string
            enum: [authorization_code, refresh_token, client_credentials]
        allowed_scopes:
          type: array
          items: { type: string }
        third_party: { type: boolean }
        access_token_ttl_seconds: { type: [integer, 'null'], minimum: 60, maximum: 3600 }
        id_token_ttl_seconds: { type: [integer, 'null'], minimum: 60, maximum: 3600 }
        disabled: { type: boolean }

    ClientSecret:
      type: object
      required: [client_id, client_secret, rotated_at]
      properties:
        client_id: { type: string }
        client_secret: { type: string }
        rotated_at: { type: string, format: date-time }

    Role:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: [string, 'null'] }
        is_system: { type: boolean }

    RoleList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Role' }

    CreateRoleRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          pattern: '^[a-z0-9][a-z0-9._-]{1,63}$'
        description: { type: [string, 'null'] }

    Group:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: [string, 'null'] }
        member_count: { type: integer, minimum: 0 }

    GroupList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Group' }

    CreateGroupRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 2, maxLength: 100 }
        description: { type: [string, 'null'] }

    UpdateGroupRequest:
      type: object
      properties:
        name: { type: string, minLength: 2, maxLength: 100 }
        description: { type: [string, 'null'] }

    GroupMember:
      type: object
      required: [user_id, email]
      properties:
        user_id: { type: string, format: uuid }
        email: { type: string, format: email }
        name: { type: [string, 'null'] }

    GroupMemberList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/GroupMember' }

    AddGroupMembersRequest:
      type: object
